name: Tests
on:
  push:
    paths:
      - "**/*"
      - "!.gitattributes"
      - "!.gitignore"
      - "!README.md"
jobs:
  evaluate:
    name: evaluate-home-configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Evaluate home configuration
        run: |
          nix --version
          nix eval --raw .#homeConfigurations.ryhkml.activationPackage.drvPath
